[build-system]
# Upper bound is REQUIRED to publish, not tidiness. hatchling 1.29 emits
# Metadata-Version 2.5, and twine (package.py) overrides packaging's valid-version
# list with its own, capped at 2.4 — so a 2.5 wheel is rejected before upload with
# "'2.5' is not a valid metadata version". The publish job runs twine, so this
# would fail AFTER the tag, which is the expensive moment to find out.
# Lift once twine accepts 2.5; verify with `twine check dist/*` before doing so.
requires = ["hatchling>=1.27,<1.29"]
build-backend = "hatchling.build"

[project]
name = "web-speed-agent"
version = "0.6.0"
description = "Local browser automation + Web Speed API integration for authenticated web extraction"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["web", "scraping", "extraction", "playwright", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "keyring>=24.0",
    # Core, not optional: mcp_server.py imports mcp.server.fastmcp at module
    # level and the MCP server is the primary way people use this package.
    # As an extra, `pip install web-speed-agent` produced an ImportError.
    #
    # Upper bound is REQUIRED, not caution: mcp 2.0 removed mcp.server.fastmcp,
    # so an unpinned ">=1.0.0" resolves to 2.x and the agent dies on import.
    # Lift only alongside a port to the 2.x server API.
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
# Retained (empty) so existing `pip install web-speed-agent[mcp]` commands and
# docs keep working — mcp is a core dependency now.
mcp = []
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
webspeed-agent = "web_speed_agent.mcp_server:main"
webspeed-configure = "web_speed_agent.configure:main"

[project.urls]
Homepage = "https://getwebspeed.io"
Repository = "https://github.com/Dominic-Pi-Sunyer/web-speed-agent"
Issues = "https://github.com/Dominic-Pi-Sunyer/web-speed-agent/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"


[tool.hatch.build.targets.wheel]
# Explicit, so a new module can never be silently left out of a release again.
packages = ["web_speed_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "web_speed_agent/",
    "agent_mcp_server.py",
    "README.md",
    "LICENSE",
    "docs/",
    "examples/",
]
